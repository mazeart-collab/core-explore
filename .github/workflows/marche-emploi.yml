name: "3. Mettre à jour le marché de l'emploi"

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Nombre de métiers à interroger (vide = tous, environ 2 minutes). Ex. 20 pour un essai rapide."
        type: string
        default: ""
      codes:
        description: "Codes ROME précis, séparés par des virgules (facultatif). Ex. A1101,M1805"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: data-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  marche:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Interroger l'API Marché du travail de France Travail
        env:
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          LIMITE: ${{ inputs.limite }}
          CODES: ${{ inputs.codes }}
        run: npm run data:marche

      - name: Enregistrer metiers.json
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/metiers.json
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi
          git commit -m "Données : marché de l'emploi France Travail ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
